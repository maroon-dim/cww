<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Interactive Israel map and fictional cyber simulation."><title>SPECTER / Interactive Simulation</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
<main id="map-surface" aria-label="Interactive company map" tabindex="0" aria-describedby="map-help">
<p id="map-help" class="sr-only">Drag to pan, scroll or pinch to zoom. Arrow keys pan, plus and minus zoom, Home resets. Select a company to launch a fictional visual simulation.</p>
<svg id="map" aria-label="Israel boundary and company markers"><defs><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter></defs><g id="border-glow" aria-hidden="true"></g><g id="borders"></g><g id="leader-lines" aria-hidden="true"></g><g id="pins" aria-hidden="true"></g></svg>
<div id="labels"></div>
<div class="map-controls" aria-label="Map controls"><button id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out" title="Zoom out">−</button><button id="fit" aria-label="Fit Israel to screen" title="Fit map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 12h8m-4-4v8"/></svg></button><button id="fullscreen" aria-label="Enter fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div>
</main>
<dialog id="attack-dialog" aria-labelledby="attack-title" aria-describedby="attack-subtitle"><div class="attack-layout"><div class="attack-head"><span>SP / SEQUENCE INITIATED</span><button id="close" aria-label="Close simulation">ESC <span>×</span></button></div><div class="attack-main"><div class="attack-symbol" aria-hidden="true"><span>⌖</span></div><div class="eyebrow red" id="active-company">ENTITY SELECTED</div><h2 id="attack-title">Attack Started<span class="glitch-copy glitch-red" aria-hidden="true">Attack Started</span><span class="glitch-copy glitch-cyan" aria-hidden="true">Attack Started</span></h2><p class="attack-subtitle" id="attack-subtitle">Look At The Screens</p></div></div></dialog>
</body></html>
